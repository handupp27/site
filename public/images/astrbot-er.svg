<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">AstrBot 里几样东西的关系（ER 图）</title>
  <desc id="d">一个配置文件绑定多个消息平台，调用多个模型提供商，并指定一个默认人格。一个消息平台下有多个会话；一个用户可以有多个会话；每个会话使用一个人格。</desc>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; }
    .box { fill: #f5f6fa; stroke: #c9d0dd; stroke-width: 1.5; }
    .hot { fill: #eef0ff; stroke: #2337ff; stroke-width: 1.5; }
    .head { font-size: 16px; font-weight: 600; fill: #0f1219; text-anchor: middle; }
    .field { font-size: 13px; fill: #60739f; }
    .sep { stroke: #c9d0dd; stroke-width: 1; }
    .rel { stroke: #2337ff; stroke-width: 1.8; fill: none; }
    .card { font-size: 13px; font-weight: 600; fill: #2337ff; text-anchor: middle; }
    .verb { font-size: 12px; fill: #222939; text-anchor: middle; }
  </style>

  <!-- 第一行 -->
  <rect class="box" x="20" y="30" width="190" height="115" rx="10"/>
  <text class="head" x="115" y="56">消息平台</text>
  <line class="sep" x1="20" y1="68" x2="210" y2="68"/>
  <text class="field" x="36" y="92">QQ 官方机器人</text>
  <text class="field" x="36" y="114">AppID、密钥</text>

  <rect class="hot" x="265" y="30" width="190" height="115" rx="10"/>
  <text class="head" x="360" y="56">配置文件</text>
  <line class="sep" x1="265" y1="68" x2="455" y2="68"/>
  <text class="field" x="281" y="92">default</text>
  <text class="field" x="281" y="114">默认模型、默认人格</text>
  <text class="field" x="281" y="134">语音、搜索开关</text>

  <rect class="box" x="510" y="30" width="190" height="115" rx="10"/>
  <text class="head" x="605" y="56">模型提供商</text>
  <line class="sep" x1="510" y1="68" x2="700" y2="68"/>
  <text class="field" x="526" y="92">DeepSeek（对话）</text>
  <text class="field" x="526" y="114">Edge TTS（语音）</text>

  <!-- 第二行 -->
  <rect class="box" x="20" y="255" width="190" height="115" rx="10"/>
  <text class="head" x="115" y="281">用户</text>
  <line class="sep" x1="20" y1="293" x2="210" y2="293"/>
  <text class="field" x="36" y="317">我（openid）</text>
  <text class="field" x="36" y="339">资料、关系远近</text>

  <rect class="hot" x="265" y="255" width="190" height="115" rx="10"/>
  <text class="head" x="360" y="281">会话</text>
  <line class="sep" x1="265" y1="293" x2="455" y2="293"/>
  <text class="field" x="281" y="317">聊天记录</text>
  <text class="field" x="281" y="339">记忆、情绪状态</text>

  <rect class="box" x="510" y="255" width="190" height="115" rx="10"/>
  <text class="head" x="605" y="281">人格</text>
  <line class="sep" x1="510" y1="293" x2="700" y2="293"/>
  <text class="field" x="526" y="317">系统提示词</text>
  <text class="field" x="526" y="339">可用工具</text>

  <!-- 关系 -->
  <line class="rel" x1="210" y1="88" x2="265" y2="88"/>
  <text class="card" x="237" y="80">N : 1</text>
  <text class="verb" x="237" y="106">绑定</text>

  <line class="rel" x1="455" y1="88" x2="510" y2="88"/>
  <text class="card" x="482" y="80">N : N</text>
  <text class="verb" x="482" y="106">调用</text>

  <line class="rel" x1="210" y1="312" x2="265" y2="312"/>
  <text class="card" x="237" y="304">1 : N</text>
  <text class="verb" x="237" y="330">发起</text>

  <line class="rel" x1="455" y1="312" x2="510" y2="312"/>
  <text class="card" x="482" y="304">N : 1</text>
  <text class="verb" x="482" y="330">使用</text>

  <line class="rel" x1="150" y1="145" x2="300" y2="255"/>
  <text class="card" x="178" y="205">1 : N</text>
  <text class="verb" x="262" y="196">承载</text>

  <line class="rel" x1="420" y1="145" x2="570" y2="255"/>
  <text class="card" x="515" y="192">1 : 1</text>
  <text class="verb" x="470" y="210">默认人格</text>
</svg>
